# Vale configuration for tuxcare-documentation
# Place this file at the repo root, alongside the `styles/` folder.

StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = TuxCare

# HeadingH1 cannot be trusted on these docs — `#` comment lines inside
# <CodeTabs :tabs="…"> template literals read as real H1s to every markdown parser
# (markdownlint MD025 included). See the note in HeadingH1.yml.
TuxCare.HeadingH1 = NO

# Never lint code or URLs — `tuxcare`, `dotnet`, `nodejs` etc. are valid there.
# Fenced code blocks are skipped by default; these cover inline code and links.
# NOTE: these do NOT apply to rules using `scope: raw` (AltText, ImageFormat,
# SmartQuotes), which see the unprocessed file — those rules must be
# self-limiting in their own patterns.
TokenIgnores = (https?://[^\s)]+), (`[^`]+`)

# Skip Vue <script setup> blocks and inline component tags.
# Same caveat: not honoured under `scope: raw`.
BlockIgnores = (?s)(<script[\s\S]*?</script>), (<[A-Z][A-Za-z]+[\s\S]*?/?>)
